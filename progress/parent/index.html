<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reading Future Discover 1 · Parent settings</title>
<link rel="stylesheet" href="../../assets/calm-shell.css">
<!-- Fonts: HarmonyOS Sans (see ../../assets/fonts/LICENSE.txt) + Material Symbols Rounded (Apache-2.0) -->
<script src="../../assets/progress-api.js"></script>
</head>
<body oncontextmenu="return false">
<div id="wrap">
  <header class="shell-stats" aria-label="Top bar">
    <div class="stat miles"><span class="ms">face</span> Miles</div>
    <a class="course-chip" href="../../" style="text-decoration:none">
      <span class="ms">science</span>
      Science · Weather
      <span class="ms">chevron_right</span>
    </a>
    <div class="stat last"><span class="ms">tune</span> Parent</div>
  </header>

  <div class="shell-main">
    <div class="shell-stage-fill">
      <div class="page-shell">
        <div class="page-head">
          <div>
            <h1>Parent settings</h1>
            <p>Family key &amp; sync</p>
          </div>
          <a class="course-pill" href="../" style="text-decoration:none"><span class="ms">arrow_back</span> Back to Progress</a>
        </div>

        <div class="prog-layout parent-only" style="grid-template-columns:1fr;max-width:560px">
          <aside class="settings-card" aria-label="Sync">
            <h3><span class="ms">cloud_sync</span> Progress sync</h3>
            <div class="set-row family-key">
              <div>
                <strong>Family key</strong>
                <span>Stored only on this device</span>
              </div>
              <div class="key-row">
                <input id="familyKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Family key" aria-label="Family key">
                <button type="button" class="save-key" id="saveKeyBtn">Save</button>
              </div>
              <div class="key-status" id="keyStatus">Not set</div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <nav class="shell-tabs" aria-label="Bottom tabs">
    <a class="tab" href="../../"><span class="ms">home</span> Learn</a>
    <a class="tab" href="../../science-review/"><span class="ms">replay</span> Review</a>
    <a class="tab" href="../../book/"><span class="ms">auto_stories</span> Book</a>
    <a class="tab on" href="../"><span class="ms">insights</span> Progress</a>
  </nav>
</div>
<script>
(function () {
  var RF = window.RFProgress;
  if (!RF) return;

  var keyInput = document.getElementById('familyKeyInput');
  var keyStatus = document.getElementById('keyStatus');
  var saveBtn = document.getElementById('saveKeyBtn');

  function setKeyUi(hasKey, msg, cls) {
    if (keyStatus) {
      keyStatus.textContent = msg || (hasKey ? 'Saved' : 'Not set');
      keyStatus.className = 'key-status' + (cls ? ' ' + cls : (hasKey ? ' ok' : ''));
    }
  }

  async function refresh() {
    var key = RF.getFamilyKey();
    if (!key) {
      setKeyUi(false);
      return;
    }
    setKeyUi(true, 'Checking…', 'ok');
    try {
      await RF.fetchProgress();
      setKeyUi(true, 'Synced', 'ok');
    } catch (e) {
      setKeyUi(true, 'Saved, but sync failed', 'err');
    }
  }

  saveBtn.addEventListener('click', function () {
    var k = RF.setFamilyKey(keyInput.value);
    keyInput.value = '';
    if (!k) {
      setKeyUi(false, 'Cleared');
      return;
    }
    refresh();
  });

  keyInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') saveBtn.click();
  });

  RF.consumeKeyFromQuery();
  if (RF.getFamilyKey()) setKeyUi(true, 'Checking…', 'ok');
  else setKeyUi(false);
  refresh();
})();
</script>
</body>
</html>
